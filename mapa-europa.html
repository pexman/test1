<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Europa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  /* Layout: mapa a la izquierda, ficha del país a la derecha; en móvil la ficha va debajo */
  :root {
    --bg: #eef2f4; --sea: #d6e3ea; --land: #f8f8f4; --eu: #e6e9dc; --other: #e2e2dd;
    --line: #9aa7ad; --fg: #1c2a33; --muted: #5b6b74; --accent: #b5651d; --accent-soft: #f0c99a;
    --panel: #ffffff; --dot: #1c2a33;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f171c; --sea: #13232c; --land: #2a3a42; --eu: #2f4048; --other: #222d33;
    --line: #50636d; --fg: #e5ecef; --muted: #98a8b0; --accent: #e8a35a; --accent-soft: #7a4a1e;
    --panel: #18242b; --dot: #e5ecef; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0f171c; --sea: #13232c; --land: #2a3a42; --eu: #2f4048; --other: #222d33;
    --line: #50636d; --fg: #e5ecef; --muted: #98a8b0; --accent: #e8a35a; --accent-soft: #7a4a1e;
    --panel: #18242b; --dot: #e5ecef; color-scheme: dark; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px; box-sizing: border-box; }
  .wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 12px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.5rem, 3vw, 2rem); margin: 0; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .mapbox { position: relative; background: var(--sea); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  svg { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; }
  svg.drag { cursor: grabbing; }
  .c { fill: var(--other); stroke: var(--line); stroke-width: .5; vector-effect: non-scaling-stroke; }
  .c.e { fill: var(--land); cursor: pointer; }
  .c.e:hover { fill: var(--accent-soft); }
  .c.sel, .c.sel:hover { fill: var(--accent); }
  .cap { fill: var(--dot); stroke: var(--sea); stroke-width: 1; vector-effect: non-scaling-stroke; cursor: pointer; }
  .cap.sel { fill: var(--accent); }
  .zoom { position: absolute; right: 10px; top: 10px; display: grid; gap: 4px; }
  .zoom button { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 600 18px var(--body); cursor: pointer; }
  .zoom button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .scale { position: absolute; left: 8px; bottom: 8px; font-size: 12px; color: var(--muted); background: var(--panel); padding: 2px 6px; border-radius: 4px; opacity: .9; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
  label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  select { width: 100%; font: inherit; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .ficha h2 { font-family: var(--display); font-weight: 600; font-size: 1.6rem; margin: 0 0 8px; color: var(--accent); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
  dt { color: var(--muted); } dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); margin: 0; font-size: 13px; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 13px; white-space: nowrap; }
</style>

<div class="wrap">
  <header>
    <h1>Mapa de Europa</h1>
    <p>46 países. Toca un país o su capital para ver sus datos.</p>
  </header>
  <div class="grid">
    <div class="mapbox" id="mapbox">
      <svg id="map" role="img" aria-label="Mapa político de Europa"></svg>
      <div class="zoom">
        <button id="zin" aria-label="Acercar">+</button>
        <button id="zout" aria-label="Alejar">−</button>
        <button id="zreset" aria-label="Ver toda Europa" style="font-size:13px">⟲</button>
      </div>
      <div class="scale">Proyección acimutal equivalente de Lambert (ETRS89-LAEA)</div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside>
      <div>
        <label for="pais">Ir a un país</label>
        <select id="pais"><option value="">Elige un país…</option></select>
      </div>
      <div class="ficha" id="ficha"></div>
      <p class="hint">Arrastra para mover el mapa. Usa la rueda o los botones para hacer zoom. Población aproximada.</p>
    </aside>
  </div>
</div>

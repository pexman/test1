<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de Europa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --bg: #f7f7f5; --fg: #1d1d1f; --panel: #ffffff; --muted: #6b6b70; --accent: #2b5cab; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151517; --fg: #ececee; --panel: #1f1f22; --muted: #9a9aa0; --accent: #7aa2e8; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
    h1 { font-size: 1.25rem; margin: 0; }
    header p { margin: 0; color: var(--muted); font-size: 0.9rem; flex: 1 1 200px; }
    select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--muted);
      background: var(--panel); color: var(--fg); max-width: 100%; }
    #map { flex: 1; min-height: 300px; }
    .popup h2 { font-size: 1rem; margin: 0 0 4px; color: var(--accent); }
    .popup dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 2px 10px; font-size: 0.85rem; }
    .popup dt { color: #666; }
    .popup dd { margin: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Mapa de Europa</h1>
    <p>Haz clic en un marcador para ver la capital, población y superficie de cada país.</p>
    <select id="buscar" aria-label="Ir a un país">
      <option value="">Ir a un país…</option>
    </select>
  </header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // [país, capital, lat, lon, población (millones, aprox.), superficie (km²)]
    const paises = [
      ["Albania", "Tirana", 41.33, 19.82, 2.8, 28748],
      ["Alemania", "Berlín", 52.52, 13.40, 84.4, 357588],
      ["Andorra", "Andorra la Vieja", 42.51, 1.52, 0.08, 468],
      ["Austria", "Viena", 48.21, 16.37, 9.1, 83879],
      ["Bélgica", "Bruselas", 50.85, 4.35, 11.8, 30528],
      ["Bielorrusia", "Minsk", 53.90, 27.57, 9.2, 207600],
      ["Bosnia y Herzegovina", "Sarajevo", 43.86, 18.41, 3.2, 51209],
      ["Bulgaria", "Sofía", 42.70, 23.32, 6.4, 110994],
      ["Chipre", "Nicosia", 35.17, 33.36, 1.3, 9251],
      ["Croacia", "Zagreb", 45.81, 15.98, 3.9, 56594],
      ["Dinamarca", "Copenhague", 55.68, 12.57, 5.9, 42933],
      ["Eslovaquia", "Bratislava", 48.15, 17.11, 5.4, 49035],
      ["Eslovenia", "Liubliana", 46.06, 14.51, 2.1, 20273],
      ["España", "Madrid", 40.42, -3.70, 48.6, 505990],
      ["Estonia", "Tallin", 59.44, 24.75, 1.4, 45228],
      ["Finlandia", "Helsinki", 60.17, 24.94, 5.6, 338455],
      ["Francia", "París", 48.86, 2.35, 68.4, 551695],
      ["Grecia", "Atenas", 37.98, 23.73, 10.4, 131957],
      ["Hungría", "Budapest", 47.50, 19.04, 9.6, 93028],
      ["Irlanda", "Dublín", 53.35, -6.26, 5.3, 70273],
      ["Islandia", "Reikiavik", 64.15, -21.94, 0.39, 103000],
      ["Italia", "Roma", 41.90, 12.50, 58.9, 302073],
      ["Kosovo", "Pristina", 42.66, 21.17, 1.6, 10887],
      ["Letonia", "Riga", 56.95, 24.11, 1.9, 64589],
      ["Liechtenstein", "Vaduz", 47.14, 9.52, 0.04, 160],
      ["Lituania", "Vilna", 54.69, 25.28, 2.9, 65300],
      ["Luxemburgo", "Luxemburgo", 49.61, 6.13, 0.67, 2586],
      ["Macedonia del Norte", "Skopie", 41.99, 21.43, 1.8, 25713],
      ["Malta", "La Valeta", 35.90, 14.51, 0.55, 316],
      ["Moldavia", "Chisináu", 47.01, 28.86, 2.4, 33846],
      ["Mónaco", "Mónaco", 43.74, 7.42, 0.04, 2],
      ["Montenegro", "Podgorica", 42.44, 19.26, 0.62, 13812],
      ["Noruega", "Oslo", 59.91, 10.75, 5.5, 385207],
      ["Países Bajos", "Ámsterdam", 52.37, 4.90, 17.9, 41850],
      ["Polonia", "Varsovia", 52.23, 21.01, 36.7, 312696],
      ["Portugal", "Lisboa", 38.72, -9.14, 10.6, 92212],
      ["Reino Unido", "Londres", 51.51, -0.13, 68.3, 243610],
      ["República Checa", "Praga", 50.08, 14.44, 10.9, 78871],
      ["Rumanía", "Bucarest", 44.43, 26.10, 19.0, 238397],
      ["Rusia", "Moscú", 55.76, 37.62, 146.0, 17098246],
      ["San Marino", "San Marino", 43.94, 12.45, 0.03, 61],
      ["Serbia", "Belgrado", 44.79, 20.45, 6.6, 77474],
      ["Suecia", "Estocolmo", 59.33, 18.07, 10.6, 450295],
      ["Suiza", "Berna", 46.95, 7.45, 8.9, 41285],
      ["Ucrania", "Kiev", 50.45, 30.52, 37.0, 603550],
      ["Vaticano", "Ciudad del Vaticano", 41.90, 12.45, 0.0008, 0.49]
    ];

    const map = L.map("map", { worldCopyJump: true }).setView([52, 15], 4);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const fmt = new Intl.NumberFormat("es-ES");
    const poblacion = (m) => m >= 1 ? `${fmt.format(m)} millones` : `${fmt.format(Math.round(m * 1e6))} hab.`;

    const select = document.getElementById("buscar");
    const marcadores = {};

    paises.forEach(([pais, capital, lat, lon, pob, sup]) => {
      const marker = L.circleMarker([lat, lon], {
        radius: 6, color: "#ffffff", weight: 1.5, fillColor: "#2b5cab", fillOpacity: 0.9
      }).addTo(map);
      marker.bindTooltip(pais);
      marker.bindPopup(`
        <div class="popup">
          <h2>${pais}</h2>
          <dl>
            <dt>Capital</dt><dd>${capital}</dd>
            <dt>Población</dt><dd>${poblacion(pob)}</dd>
            <dt>Superficie</dt><dd>${fmt.format(sup)} km²</dd>
          </dl>
        </div>`);
      marcadores[pais] = marker;

      const opt = document.createElement("option");
      opt.value = pais;
      opt.textContent = pais;
      select.appendChild(opt);
    });

    select.addEventListener("change", () => {
      const m = marcadores[select.value];
      if (!m) return;
      map.flyTo(m.getLatLng(), 6);
      m.openPopup();
    });
  </script>
</body>
</html>
